[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tideclock"
version = "1.0.0"
description = "Offline tide harmonic predictor, moon phase tracker, and safe harbor window planner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TideClock" }]
keywords = ["tides", "moon", "harbor", "offline", "cli", "kayak", "sailing"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
tideclock = "tideclock:main"

[tool.setuptools]
py-modules = ["tideclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
